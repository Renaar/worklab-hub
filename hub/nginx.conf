# Configuration nginx du hub du worklab.
# Ce fichier est inclus dans le bloc « http » de nginx (conf.d/default.conf).

# --- Réglages généraux ---------------------------------------------------------

# Ne pas afficher la version de nginx dans les en-têtes et les pages d'erreur
server_tokens off;

# L'API de modération de Turbo Dactylo accepte au plus 4 Ko : 16 Ko suffisent
# largement et bloquent les envois abusifs.
client_max_body_size 16k;

gzip on;
gzip_vary on;
gzip_proxied any;          # aussi pour les réponses de turbo-dactylo
gzip_min_length 512;
# text/html est toujours compressé par nginx, inutile de le lister
gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

# WebSocket : « Connection: upgrade » seulement si le navigateur le demande
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Les pages HTML sont revalidées à chaque visite : une mise à jour des apps
# apparaît sans Ctrl+F5. Une valeur vide = en-tête non envoyé (CSS, JS…).
map $sent_http_content_type $cache_control_html {
    ~*^text/html  "no-cache";
    default       "";
}

# --- Serveur ----------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Redirections relatives (« Location: /plan/ ») : elles restent justes
    # quel que soit le port publié (80, 8080…).
    absolute_redirect off;

    # DNS interne de Docker. Utilisé avec une variable dans proxy_pass, il
    # permet au hub de démarrer même si turbo-dactylo est arrêté : le nom
    # n'est résolu qu'à la requête, et revérifié toutes les 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # En-têtes communs. Ils sont tous déclarés ici, au niveau du serveur, car
    # un add_header dans une location annulerait ceux du serveur.
    # Pas de Content-Security-Policy stricte : les apps utilisent du script inline.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control $cache_control_html;

    # Pages d'erreur en français, servies depuis un dossier hors du site
    error_page 404 /erreurs/404.html;
    error_page 502 503 504 /erreurs/50x.html;
    location ^~ /erreurs/ {
        internal;
        root /usr/share/nginx;
    }

    # Fichiers et dossiers cachés (.git, .env…) : toujours 404
    location ~ /\. {
        return 404;
    }

    # Page d'accueil et apps statiques (fichiers copiés dans l'image).
    # nginx redirige de lui-même /plan vers /plan/ (301) : aucune route à
    # écrire pour une nouvelle app statique.
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Apps à conteneur : une route par app ------------------------------------

    # Turbo Dactylo (HTTP + WebSocket). Le préfixe /dactylo/ est retiré : le
    # jeu reçoit /, /game.js, /api/classements…
    location = /dactylo {
        return 301 /dactylo/;
    }
    location /dactylo/ {
        # Variable = résolution à la demande (voir « resolver » plus haut).
        # Avec une variable, proxy_pass ne retire plus le préfixe : c'est le
        # rôle du rewrite (« break » : on reste dans cette location).
        set $turbo_dactylo http://turbo-dactylo:3000;
        rewrite ^/dactylo/(.*)$ /$1 break;
        proxy_pass $turbo_dactylo;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conteneur arrêté ou bloqué : page d'erreur rapide plutôt qu'attente
        proxy_connect_timeout 5s;
        # Une course peut rester ouverte longtemps. Le serveur envoie un ping
        # toutes les 30 s, 1 h laisse une grande marge.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
