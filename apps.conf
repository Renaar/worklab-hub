# Liste des apps du worklab : la seule source de vérité.
# deploy.sh, la page d'accueil du hub et smoke-test.sh en dérivent tous.
#
# Une ligne par app, 8 champs séparés par « | » (pas de « | » dans les textes) :
#
#   id | dépôt git | réf | type | fichiers | chemin | titre | description
#
#   id           nom court, sans espace. Sert de nom de dossier dans sources/
#                et de nom d'icône (hub/site/icones/<id>.svg).
#   dépôt git    URL du dépôt (https).
#   réf          branche (ex. main) ou commit complet (40 caractères) pour
#                figer une version.
#   type         statique  : fichiers copiés dans l'image du hub ;
#                conteneur : app avec son propre conteneur (il faut alors
#                aussi un service dans docker-compose.yml et une route dans
#                hub/nginx.conf).
#   fichiers     statique : fichiers ou dossiers à servir, séparés par des
#                espaces. Un dossier terminé par « / » est copié avec son
#                contenu (ex. public/). Rien d'autre n'est copié.
#                conteneur : « - ».
#   chemin       chemin sur le hub, avec « / » au début et à la fin.
#   titre        affiché sur la carte de la page d'accueil. C'est aussi le
#                <title> de la page de l'app : smoke-test.sh le vérifie.
#   description  une phrase courte, affichée sous le titre.
#
# Les lignes vides et celles qui commencent par « # » sont ignorées.

plan-de-classe|https://github.com/Renaar/Plan-De-Classe.git|main|statique|index.html|/plan/|Plan de Classe|Compose le plan de la salle et tire au sort les places des élèves.
heureux-hasard|https://github.com/Renaar/Heureux-Hasard.git|main|statique|public/|/hasard/|Heureux Hasard|Roue de tirage au sort, groupes aléatoires et petits outils de classe.
turbo-dactylo|https://github.com/Renaar/Turbo-Dactylo.git|main|conteneur|-|/dactylo/|Turbo Dactylo|Course de dactylographie en direct, par salon ou par équipes.
